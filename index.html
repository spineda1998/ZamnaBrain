    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws') || e.message.includes('vite') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason && (e.reason.message || e.reason) || '');
        if (str.includes('WebSocket') || str.includes('ws') || str.includes('vite') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>

  </body>
